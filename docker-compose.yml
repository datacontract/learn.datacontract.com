services:
  postgres:
    image: postgres:17
    container_name: odcs-odps-workshop-postgres
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop
    ports:
      - "5433:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./data:/data:ro
    healthcheck:
      # TCP only: the temporary server that loads initdb/ listens on the Unix socket only
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "workshop", "-d", "workshop"]
      interval: 2s
      timeout: 5s
      retries: 30
