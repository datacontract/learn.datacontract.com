<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 720px; overflow: hidden; font-family: Inter, sans-serif; color: #0f172a;
    background: radial-gradient(circle at 85% 15%, #e0e7ff 0, transparent 45%), radial-gradient(circle at 10% 100%, #ecfdf5 0, transparent 40%), #fff; }
  .wrap { position: absolute; inset: 0; padding: 90px 110px; display: flex; flex-direction: column; justify-content: center; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 24px; font-weight: 600; color: #334155; }
  .brand img { width: 46px; height: 46px; }
  .eyebrow { margin-top: 70px; font-size: 22px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #4f46e5; }
  h1 { margin-top: 14px; font-size: 64px; line-height: 1.08; font-weight: 800; letter-spacing: -0.03em; max-width: 1000px; }
  p { margin-top: 22px; font-size: 26px; color: #475569; max-width: 950px; line-height: 1.4; }
  .foot { position: absolute; left: 110px; bottom: 70px; font-size: 20px; font-weight: 600; color: #64748b; }
</style></head><body>
<div class="wrap">
  <div class="brand"><img src="../../tutorial/public/favicon.png"> Data Contracts in Practice</div>
  <div class="eyebrow" id="eyebrow"></div>
  <h1 id="title"></h1>
  <p id="subtitle"></p>
</div>
<div class="foot">learn.datacontract.com</div>
<script>
const q = new URLSearchParams(location.search)
document.getElementById('eyebrow').textContent = q.get('eyebrow') || ''
document.getElementById('title').textContent = q.get('title') || ''
document.getElementById('subtitle').textContent = q.get('subtitle') || ''
</script>
</body></html>
